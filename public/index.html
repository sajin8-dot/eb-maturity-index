<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer Brand Maturity Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1A24;--mut:#525263;--line:#E2E2E8;--paper:#F6F6F8;--bg:#FFFFFF;--surface:#FFFFFF;
  --acc:#D35400;--acch:#B34500;--gold:#E99A10;--tint:#FDF2E9;--tint-line:#F4D3B8;
  --ok:#1D6B3A;--ok-bg:#E8F5EC;--gap:#B83B2A;--gap-bg:#FDF0EE;
  --r1:#D6D6DD;--r2:#F3CF8F;--r3:#E99A10;--r4:#E0770C;--r5:#D35400;
  --sh-sm:0 1px 2px rgba(26,26,36,.04),0 1px 3px rgba(26,26,36,.03);
  --sh-md:0 4px 14px rgba(26,26,36,.07),0 1px 3px rgba(26,26,36,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 14px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-columns:248px 1fr;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:700;margin:0;line-height:1.18;letter-spacing:-.01em}
h1{font-size:36px}h2{font-size:22px}h3{font-size:18px}h4{font-size:15px}
p{margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
aside{background:var(--paper);border-right:1px solid var(--line);padding:28px 0 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:0 24px 20px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:17px;line-height:1.22}
.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-top:6px}
.side-ctx{margin:0 16px 18px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh-sm);font-size:12px}
.side-ctx .sc-name{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-ctx .sc-meta{color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.side-ctx .sc-wave{display:inline-block;background:var(--tint);color:var(--acch);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:99px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;padding:11px 22px;text-align:left;color:var(--mut);font-weight:500}
.nav button.on{border-left-color:var(--acc);color:var(--ink);background:#fff;font-weight:600;box-shadow:var(--sh-sm)}
.nav button:hover:not(.on){color:var(--acc);background:rgba(255,255,255,.55)}
.side-foot{margin-top:auto;padding:14px 22px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.side-foot .stat-row{display:flex;align-items:center;gap:7px;margin-top:4px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sdot.saving{background:var(--gold)}
.sdot.err{background:var(--acc)}
main{padding:48px 64px 120px;max-width:1280px;width:100%}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--tint);border:1px solid var(--tint-line);border-radius:12px;padding:11px 16px;margin-bottom:28px;font-size:13px}
.demo-bar b{color:var(--acch)}
.demo-bar .db-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ic{flex:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.lede{max-width:72ch;color:var(--mut);font-size:14.5px;margin-top:10px;line-height:1.65}
section{margin-top:52px}
section>h2{margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:0}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--paper);color:var(--acc)}
.ib.arm{background:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:8px 16px;font-weight:500;font-size:13.5px;box-shadow:var(--sh-sm)}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acch);border-color:var(--acch);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--mut)}
.btn.ghost:hover{background:var(--paper);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;background:var(--paper);padding:2px 10px;font-size:11.5px;color:var(--mut);font-weight:500}
.chip.hot{background:var(--tint);color:var(--acch)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
label,.lab{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:18px 0 6px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#C6C6D2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(233,154,16,.22)}
textarea{width:100%;min-height:68px;resize:vertical}
/* framework */
.axes{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:28px;padding:24px 28px;background:var(--paper);border-radius:14px;border:1px solid var(--line)}
.axes h3{margin-bottom:8px}
.waves{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.wave{padding:22px 20px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--sh-sm);display:flex;flex-direction:column}
.wave .n{font-family:'Playfair Display',serif;font-weight:700;font-size:44px;line-height:1;color:var(--acc)}
.wave .pc{font-size:12px;color:var(--mut);margin:6px 0 12px}
.wave h3{margin-bottom:10px}
.wave details{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.wave summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--acch)}
.fn{font-size:12.5px;margin-top:8px}.fn div{padding:6px 0;border-bottom:1px solid var(--line)}.fn div:last-child{border-bottom:0}.fn b{display:block}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.wq-tbl td.wq-opt{cursor:pointer;border-radius:8px;padding:10px 12px;transition:background .15s,color .15s}
.wq-tbl td.wq-opt:hover{background:var(--paper)}
.wq-tbl td.wq-opt.picked{background:var(--tint);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--acc)}
.wq-res{margin-top:16px;padding:16px 20px;border-radius:12px;border:1px solid var(--tint-line);background:var(--tint);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wq-res b{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink)}
.rungh{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}
.rungh div{padding:14px;font-size:12.5px;border-radius:12px;box-shadow:var(--sh-sm)}
.rungh b{display:block;font-family:'Playfair Display',serif;font-size:16px;margin-bottom:4px}
.r1{background:var(--r1)}.r2{background:var(--r2)}.r3{background:var(--r3)}.r4{background:var(--r4);color:#fff}.r5{background:var(--r5);color:#fff}
.pillar{margin-top:36px}
.pillar>h3{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.pillar>h3 span{font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:0 12px;min-width:960px}
.hdr{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
.hdr.cur{color:var(--acc)}
.xr{display:contents}
.xr>*{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.xr .nm b{display:block}
.xr .nm small{color:var(--mut)}
.xr .cell{font-size:12.5px;color:var(--ink);padding-right:8px}
.xr .cell.low{color:#8a8a98;background:repeating-linear-gradient(135deg,transparent 0 6px,#f1f1f4 6px 7px)}
.xr:hover>*{background-color:var(--paper)}
.det{grid-column:1/-1;padding:18px 20px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:36px;background:var(--paper);border-radius:10px;margin:4px 0}
.det p{margin:0 0 4px}
.scroll{overflow-x:auto}
.notes{columns:2;column-gap:56px;margin-top:16px}
.notes li{break-inside:avoid;margin-bottom:10px}
/* ctx bar */
.ctx{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;margin-top:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.ctx .f{display:flex;flex-direction:column}
.ctx .f label{margin:0 0 4px}
.cohorts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.cohorts .pill{border-radius:99px;border:1px solid var(--line);background:#fff;padding:6px 14px;font-weight:500}
.cohorts .pill:hover:not(.on){border-color:var(--acc);color:var(--acc)}
.cohorts .pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:24px}
.how div{border-top:2px solid var(--acc);padding-top:10px;font-size:13px;color:var(--mut)}
.how b{display:block;color:var(--ink);font-family:'Playfair Display',serif;font-size:15px;margin-bottom:4px}
.sum{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:22px;padding:14px 0;border-bottom:1px solid var(--line);margin-top:20px;flex-wrap:wrap}
.sum b{font-family:'Playfair Display',serif;font-size:22px}
.sum span{color:var(--mut);font-size:12px}
.sum .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.atool{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:18px 0 8px;padding:12px 16px;background:var(--paper);border-radius:12px;border:1px solid var(--line)}
.sbox{position:relative;flex:1;min-width:210px}
.sbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.sbox input{width:100%;padding-left:34px;background:#fff}
.fpills{display:flex;flex-wrap:wrap;gap:6px}
.fpills button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--mut)}
.fpills button:hover{border-color:var(--acc);color:var(--acc)}
.fpills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.ptabs button{border-radius:99px;border:1px solid var(--line);background:#fff;padding:6px 14px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.ptabs button .cnt{font-size:11px;background:var(--paper);color:var(--mut);padding:1px 7px;border-radius:99px}
.ptabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ptabs button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.mini{display:grid;grid-template-columns:2fr 1.4fr 64px;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.mini small{display:block;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:16px 0;background:#fff;box-shadow:var(--sh-sm);transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--sh-md)}
.card.collapsed{padding:14px 20px}
.card header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card.collapsed header{align-items:center}
.card header .id{font:600 11px Inter;letter-spacing:.12em;color:var(--acc)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.means{color:var(--mut);margin:6px 0 14px}
.wv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wv div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;background:#fff}
.wv b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.wv .cur{border-color:var(--acc);background:var(--tint)}
.wv .low{color:#8a8a98}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.two p{margin:0}
small{font-size:12px;color:var(--mut)}
.rungs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative}
.rg{border:2px solid transparent;border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;font-weight:500;opacity:.58}
.rg b{display:block;font-family:'Playfair Display',serif;font-size:20px}
.rg:hover{opacity:.92;transform:translateY(-1px)}
.rgw{display:block}
.rgw .rg{width:100%}
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:0;width:min(100%,420px);z-index:20;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;font-weight:400;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none}
.tip b{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;opacity:.8}
.tip i{display:block;font-style:normal;margin-top:6px;opacity:.7;font-size:11px}
.rgw:hover .tip,.rgw:focus-within .tip{display:block}
.lnk{border:0;background:none;padding:0;margin-top:8px;color:var(--acc);font-weight:500;font-size:12px;text-decoration:underline;cursor:pointer}
.rdef{margin:8px 0 0;padding:12px 14px;border:1px solid var(--tint-line);border-radius:10px;background:var(--tint);font-size:12px}
.rdef p{margin:4px 0}
.hid{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:16px 0;background:var(--tint);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hid p{margin:0;flex:1;min-width:240px}
.rnote{font-size:12px;color:var(--mut);margin:0 0 10px}
.rg.on{opacity:1;border-color:var(--ink);box-shadow:var(--sh-sm)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 16px;font-weight:500}
.seg button:hover:not(.on){background:var(--paper)}
.seg button.on{background:var(--ink);color:#fff}
.foot{display:flex;gap:32px;flex-wrap:wrap;align-items:end}
.ok{color:var(--ok);font-size:12px;font-weight:600}.warn{color:var(--acch);font-size:12px;font-weight:600}.mute{color:var(--mut);font-size:12px}
.off{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.off .t{flex:1}.off small{display:block}
/* report */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:#fff;box-shadow:var(--sh-sm)}
.kpi.hi{border-color:var(--tint-line);background:var(--tint)}
.kpi .m{font-family:'Playfair Display',serif;font-weight:700;font-size:44px;line-height:1;color:var(--ink)}
.kpi.hi .m{color:var(--acc)}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:8px}
.kpi .sub{font-size:12px;color:var(--mut);margin-top:4px}
.ev-bar{height:5px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.ev-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.big{display:flex;gap:56px;flex-wrap:wrap;margin-top:24px}
.big .m{font-family:'Playfair Display',serif;font-weight:700;font-size:48px;line-height:1}
.big .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:8px}
.verdict{font-family:'Playfair Display',serif;font-size:24px;line-height:1.32;max-width:38ch;margin-top:24px}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:start}
.radar-wrap{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff;box-shadow:var(--sh-sm);margin-bottom:24px}
.radar-wrap h3{font-size:16px;margin-bottom:4px}
.radar-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.radar-leg span{display:inline-flex;align-items:center;gap:6px}
.radar-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rdist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--paper);gap:2px;margin:12px 0 8px}
.rdist i{display:block;height:100%}
.rdist-l{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.rdist-l span{display:inline-flex;align-items:center;gap:5px}
.rdist-l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.trend-wrap{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:#fff;box-shadow:var(--sh-sm);margin-top:16px}
.lad{display:flex;gap:3px}
.lad i{flex:1;height:8px;background:var(--line);border-radius:2px}
.lad i.on1{background:var(--r1)}.lad i.on2{background:var(--r2)}.lad i.on3{background:var(--r3)}.lad i.on4{background:var(--r4)}.lad i.on5{background:var(--r5)}
.meter{height:4px;background:var(--line);border-radius:99px;margin-top:6px;overflow:hidden}.meter i{display:block;height:4px;background:var(--acc);border-radius:99px}
.pb{padding:20px 0;border-bottom:1px solid var(--line)}
.pb h3{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.pb .no{font-family:'Playfair Display',serif;font-size:30px;color:var(--acc)}
.pb dl{display:grid;grid-template-columns:160px 1fr;gap:6px 20px;margin:12px 0 0}
.pb dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding-top:3px}
.pb dd{margin:0}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:600}
.tag.b{background:var(--tint);color:var(--acch)}.tag.m{background:var(--paper);color:var(--mut)}.tag.a{background:var(--ok-bg);color:var(--ok)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}
.plan .pstep{border:1px solid var(--line);border-top:3px solid var(--acc);padding:16px 18px;background:#fff;border-radius:12px;box-shadow:var(--sh-sm)}
.plan .pstep .sno{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font:700 11px Inter,sans-serif;margin-right:8px}
.plan .pstep .shead{display:flex;align-items:center;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.plan .pstep b{font-family:'Playfair Display',serif;font-size:16px;display:block;margin-bottom:6px;color:var(--ink)}
/* executive infographic & visual analytics */
.viz-box{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:#fff;box-shadow:var(--sh-sm);margin-top:16px}
.viz-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.viz-head h3{font-size:17px}
.info-grid{display:grid;grid-template-columns:5fr 7fr;gap:18px;margin-top:22px;align-items:stretch}
.gauge-card{border:1px solid var(--tint-line);background:linear-gradient(180deg,var(--tint) 0%,#fff 58%);border-radius:14px;padding:20px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.gauge-foot{width:100%;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-size:12px;color:var(--mut)}

/* ---------- scoring ---------- */
function defaultVd(sc,wave){
 if(!sc)return'';
 if(sc<wave)return'b';
 if(wave===4)return'm'; // Category (Rung 5) & Authority (Rung 4) both meet Transformation Hub — never "Above" Wave 4
 return sc>wave?'a':'m';
}
function effVd(a,wave){
 const sc=a&&a.sc?a.sc:0;
 if(!sc)return'';
 const raw=a.vd||defaultVd(sc,wave);
 return(wave===4&&raw==='a')?'m':raw;
}
function compute(client,cohort){
 const wave=client.wave,rows=[];
 SUBS.forEach(s=>{const a=cohort.a[s.id];if(a&&a.in)rows.push({s,a,w:1,sc:a.sc||0,ok:!!(a.sc&&(a.ev||'').trim()),vd:effVd(a,wave)})});
 const scored=rows.filter(r=>r.sc),valid=scored.filter(r=>r.ok);
 const wm=(arr,f)=>{const t=arr.reduce((x,r)=>x+r.w,0);return t?arr.reduce((x,r)=>x+f(r)*r.w,0)/t:null};
 const avg=wm(scored,r=>r.sc),avgV=wm(valid,r=>r.sc);
 const idx=v=>v==null?null:Math.round((v-1)/4*100);
 const pil=PIL.map((n,p)=>{const g=scored.filter(r=>r.s.p===p),gv=valid.filter(r=>r.s.p===p);return{n,p,cnt:g.length,avg:wm(g,r=>r.sc),avgV:wm(gv,r=>r.sc)}});
 const below=scored.filter(r=>r.vd==='b'),above=scored.filter(r=>r.vd==='a');
 const cand=scored.filter(r=>r.sc<5&&(r.vd!=='a'||r.a.pr==='f')).sort((x,y)=>((y.a.pr==='f')-(x.a.pr==='f'))||((y.vd==='b')-(x.vd==='b'))||(x.sc-y.sc));
 const top=[],used=new Set();
 cand.forEach(r=>{const o=r.s.owner.split(' with ')[0];if(!used.has(o)&&top.length<3){top.push(r);used.add(o)}});
 cand.forEach(r=>{if(top.length<3&&!top.includes(r))top.push(r)});
 const strengths=scored.filter(r=>r.vd==='a'||r.sc>=4).sort((x,y)=>y.sc-x.sc).slice(0,4);
 return{wave,rows,scored,valid,avg,avgV,idx:idx(avg),idxV:idx(avgV),pil,below,above,top,strengths,
  missing:scored.filter(r=>!r.ok),unscored:rows.filter(r=>!r.sc),n:rows.length};
}
function scopeWarn(n){
 return n<9?'Below the recommended 9–15 sub-outcomes; the profile may be too thin.':n>15?'Above the recommended 9–15 sub-outcomes; consider trimming for a sharper profile.':'Within the recommended 9–15 sub-outcomes.';
}
function waveLine(client,R){
 const W=WAVES[R.wave-1].name;
 if(!R.scored.length)return'Score a few sub-outcomes on the Audit tab, and this line will tell you how the brand stands against what is expected at this wave.';
 if(R.wave>=3&&R.avg<=2.5)return`The centre's mandate has outgrown its employer brand story. A ${W} centre is still being judged on the kind of communication expected of a Satellite, with an average rung of ${R.avg.toFixed(1)} against a wave that asks for ownership language and proof.`;
 if(R.below.length/R.scored.length>=0.5)return`${R.below.length} of ${R.scored.length} scored sub-outcomes sit below what a ${W} centre is expected to show. That gap is the main work for this engagement.`;
 if(R.below.length===0&&R.above.length>0)return`No scored sub-outcome sits below the ${W} expectation, and ${R.above.length} sit above it. Say so plainly to the client, and then choose together where to aim next.`;
 return`${R.below.length} of ${R.scored.length} scored sub-outcomes sit below the ${W} expectation. The profile is uneven, and that unevenness is the most useful thing to show the client.`;
}
function nextMove(r){
 const to=Math.min(r.sc+1,5);
 if(r.sc>=4)return`Hold at ${RUNG[r.sc]} for now. Reaching Category takes years and depends on the city and the practice, so it should not be sold as a goal for this year. The useful work is to protect the evidence the centre already has and keep it fresh.`;
 return`Move from ${RUNG[r.sc]} to ${RUNG[to]}. This is one rung only, which is the most a centre can realistically climb in a year.`;
}

function waveMatrixSvg(c,h,R,bm,lg){
 const curIdx=R&&(R.idxV!=null?R.idxV:R.idx);
 if(curIdx==null&&!(bm&&bm.idx))return'';
 const myIdx=curIdx!=null?curIdx:bm.idx.v;
 const W=780,H=390,pL=56,pR=140,pT=28,pB=52,pw=W-pL-pR,ph=H-pT-pB;
 const xW=w=>pL+((w-0.5)/4)*pw,yI=v=>pT+ph-(Math.max(0,Math.min(100,v))/100)*ph;
 const bandPts=[`${xW(0.6)},${yI(32)}`,`${xW(4.4)},${yI(98)}`,`${xW(4.4)},${yI(68)}`,`${xW(0.6)},${yI(5)}`].join(' ');
 const gridY=[0,25,50,75,100].map(v=>`<line x1="${pL}" y1="${yI(v).toFixed(1)}" x2="${W-pR+40}" y2="${yI(v).toFixed(1)}" stroke="#ECECF1" stroke-width="1"/><text x="${pL-10}" y="${(yI(v)+3.5).toFixed(1)}" text-anchor="end" font-size="11" fill="#8A8A98">${v}</text>`).join('');
 const gridX=[1,2,3,4].map(w=>`<line x1="${xW(w).toFixed(1)}" y1="${pT}" x2="${xW(w).toFixed(1)}" y2="${H-pB}" stroke="#E2E2E8" stroke-dasharray="3 3"/><text x="${xW(w).toFixed(1)}" y="${H-24}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1A24">Wave ${w}</text><text x="${xW(w).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="#525263">${WAVES[w-1].name}</text>`).join('');

 // Collect all plotted nodes (peers + current cohort + optional baseline)
 const nodes=[];
 if(S.role==='admin'&&lg&&lg.rows&&lg.rows.length){
  lg.rows.filter(r=>r.eligible&&r.cohort_id!==h.id).forEach(r=>nodes.push({wave:r.wave,idx:r.idx,lbl:`${r.client} (${r.cohort}) · Wave ${r.wave} · Index ${r.idx}`,short:r.client,kind:r.client_id===c.id?'same':'peer'}));
 }else if(bm&&bm.dist&&bm.dist.length){
  let pn=0;
  bm.dist.filter(r=>!r.me).forEach(r=>{pn++;nodes.push({wave:r.wave,idx:r.idx,lbl:`Peer ${String.fromCharCode(64+pn)} · Wave ${r.wave} · Index ${r.idx}`,short:'',kind:'peer'})});
 }
 let baseNode=null;
 if(h.hist&&h.hist.length>=2){
  const first=h.hist[0],fIdx=first.idxv!=null?first.idxv:first.idx;
  if(fIdx!=null&&fIdx!==myIdx){
   baseNode={wave:c.wave,idx:fIdx,lbl:`${first.d} baseline · Index ${fIdx}`,short:`${first.d} (${fIdx})`,kind:'base'};
   nodes.push(baseNode);
  }
 }
 const meNode={wave:c.wave,idx:myIdx,lbl:`${c.name} — ${h.name} · Wave ${c.wave} · Index ${myIdx}`,short:`${h.name} (${myIdx})`,kind:'me'};
 nodes.push(meNode);

 // Group by wave, spread X gently within wave, assign left/right label sides, and relax Y so labels never overlap
 const byWave={1:[],2:[],3:[],4:[]};
 nodes.forEach(n=>(byWave[n.wave]||byWave[3]).push(n));
 Object.entries(byWave).forEach(([w,arr])=>{
  arr.sort((a,b)=>b.idx-a.idx);
  const wNum=+w;
  arr.forEach((n,i)=>{
   const off=n.kind==='me'||n.kind==='base'?0.03:((i%3)-1)*0.09;
   n.cx=xW(wNum+off);
   n.cy=yI(n.idx);
   n.ly=n.cy;
   n.side=wNum===1?1:(n.kind==='me'?1:(i%2===0?1:-1));
  });
  [1,-1].forEach(side=>{
   const grp=arr.filter(n=>n.short&&n.side===side).sort((a,b)=>a.ly-b.ly);
   const minGap=16,lo=pT+14,hi=H-pB-14;
   for(let pass=0;pass<6;pass++){
    for(let i=1;i<grp.length;i++){
     const diff=grp[i].ly-grp[i-1].ly;
     if(diff<minGap){const push=(minGap-diff)/2;grp[i-1].ly-=push;grp[i].ly+=push}
    }
    grp.forEach(n=>{if(n.ly<lo)n.ly=lo;if(n.ly>hi)n.ly=hi});
   }
  });
 });

 let traj='';
 if(baseNode){
  traj=`<line x1="${baseNode.cx.toFixed(1)}" y1="${baseNode.cy.toFixed(1)}" x2="${meNode.cx.toFixed(1)}" y2="${meNode.cy.toFixed(1)}" stroke="#D35400" stroke-width="2" stroke-dasharray="4 3"/>`;
 }
 const rendered=nodes.map(n=>{
  const isMe=n.kind==='me',isBase=n.kind==='base',isSame=n.kind==='same';
  const r=isMe?8:isSame?6:isBase?4.5:5;
  const fill=isMe?'#D35400':isSame?'#E99A10':isBase?'#fff':'#7A7A8C';
  const stroke=isBase?'#D35400':'#fff';
  const sw=isMe||isBase?2:1.5;
  const op=isMe||isBase||isSame?1:0.72;
  let lblSvg='';
  if(n.short){
   const lx=n.cx+(n.side>0?(r+10):-(r+10));
   const anc=n.side>0?'start':'end';
   const leader=Math.abs(n.ly-n.cy)>2?`<line x1="${(n.cx+(n.side>0?r:-r)).toFixed(1)}" y1="${n.cy.toFixed(1)}" x2="${(lx+(n.side>0?-3:3)).toFixed(1)}" y2="${n.ly.toFixed(1)}" stroke="#C4C4D2" stroke-width="1"/>`:'';
   lblSvg=`${leader}<text x="${lx.toFixed(1)}" y="${(n.ly+3.5).toFixed(1)}" text-anchor="${anc}" font-size="${isMe?11:10}" font-weight="${isMe?700:500}" fill="${isMe?'#1A1A24':'#525263'}">${esc(n.short)}</text>`;
  }
  return`<g data-tip="${esc(n.lbl)}" style="cursor:pointer"><circle cx="${n.cx.toFixed(1)}" cy="${n.cy.toFixed(1)}" r="${r}" fill="${fill}" opacity="${op}" stroke="${stroke}" stroke-width="${sw}"/>${lblSvg}</g>`;
 }).join('');

 const peerCnt=nodes.filter(n=>n.kind==='peer'||n.kind==='same').length;
 return`<div class="viz-box"><div class="viz-head"><div><h3>Wave mandate vs. brand maturity matrix</h3><small>Centres below the shaded diagonal have outgrown their employer brand story</small></div><div class="viz-acts">${fsBtn('Wave mandate vs. brand maturity matrix')}</div></div>
  <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;max-height:420px;display:block" role="img" aria-label="Wave mandate versus brand maturity scatter matrix">
   <polygon points="${bandPts}" fill="#1D6B3A" opacity="0.08"/>
   ${gridY}${gridX}
   <text x="${pL+10}" y="${pT+16}" font-size="10" font-weight="700" fill="#1D6B3A">BRAND-LED (AHEAD OF WAVE)</text>
   <text x="${W-pR+34}" y="${H-pB-10}" text-anchor="end" font-size="10" font-weight="700" fill="#B34500">MANDATE OUTPACING BRAND (OPPORTUNITY ZONE)</text>
   ${traj}${rendered}
  </svg></div>
  <div class="radar-leg"><span><i style="background:#D35400;border-radius:50%"></i>${esc(c.name)} · ${esc(h.name)}</span>${peerCnt?`<span><i style="background:#7A7A8C;border-radius:50%"></i>Peer centres (${S.role==='admin'&&lg?'named':'anonymised'})</span>`:''}<span><i style="background:rgba(29,107,58,.22)"></i>Mandate–brand alignment band</span></div></div>`;
}

function radarSvg(R,bm){
 const cx=190,cy=154,rmax=96;
 const pt=(i,val)=>{const ang=-Math.PI/2+i*(2*Math.PI/5),r=(val/5)*rmax;return[cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
 const rings=[1,2,3,4,5].map(lv=>{
  const pts=[0,1,2,3,4].map(i=>pt(i,lv).map(n=>n.toFixed(1)).join(',')).join(' ');
  return`<polygon points="${pts}" fill="none" stroke="#E2E2E8" stroke-width="${lv===3?'1.2':'0.8'}" ${lv===3?'stroke-dasharray="3 3"':''}/>`;
 }).join('');
 const axes=[0,1,2,3,4].map(i=>{
  const[x,y]=pt(i,5),[lx,ly]=pt(i,6.05);
  const anc=Math.abs(lx-cx)<10?'middle':lx>cx?'start':'end';
  return`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E2E2E8" stroke-width="0.9"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}" font-size="11.5" font-weight="600" fill="#525263">${PIL_SHORT[i]}</text>`;
 }).join('');
 const poly=(vals,fill,stroke,dash,w=2,lbl='')=>{
  if(!vals||!vals.some(v=>v>0))return'';
  const pts=vals.map((v,i)=>pt(i,v||0).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=vals.map((v,i)=>{if(!v)return'';const[x,y]=pt(i,v);return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${stroke}" data-tip="${esc(PIL_SHORT[i])} · ${esc(lbl)}: ${v.toFixed(1)}/5" style="cursor:pointer"/>`}).join('');
  return`<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" ${dash?'stroke-dasharray="4 3"':''}/>${dots}`;
 };
 const prov=R.pil.map(p=>p.avg||0),evid=R.pil.map(p=>p.avgV||0);
 const hasPeer=bm&&bm.pillars&&bm.pillars.some(x=>x.med!=null);
 const peerMed=hasPeer?bm.pillars.map(x=>x.med||0):null;
 const peerP75=hasPeer&&bm.pillars.some(x=>x.p75!=null)?bm.pillars.map(x=>x.p75||0):null;
 const lvlMarks=[1,2,3,4,5].map(lv=>`<text x="${cx+5}" y="${(cy-(lv/5)*rmax+3).toFixed(1)}" font-size="9.5" fill="#8A8A98">${lv}</text>`).join('');
 return`<svg viewBox="0 0 380 306" width="100%" style="max-width:380px;display:block;margin:6px auto 0" role="img" aria-label="Five-pillar employer brand maturity radar chart">${rings}${axes}${lvlMarks}${peerP75?poly(peerP75,'rgba(29,107,58,0.06)','#1D6B3A',true,1.3,'Peer P75'):''}${peerMed?poly(peerMed,'rgba(82,82,99,0.10)','#525263',true,1.5,'Peer median'):''}${poly(prov,'rgba(233,154,16,0.16)','#E99A10',true,1.8,'Provisional')}${poly(evid,'rgba(211,84,0,0.22)','#D35400',false,2.2,'Evidenced')}</svg><div class="radar-leg"><span><i style="background:#D35400"></i>Evidenced avg</span><span><i style="background:#E99A10"></i>Provisional avg</span>${peerMed?'<span><i style="background:#525263"></i>Peer median</span>':''}${peerP75?'<span><i style="background:#1D6B3A"></i>Peer top quartile (P75)</span>':''}</div>`;
}

function pillarDumbbell(R,bm){
 const pct=n=>Math.max(0,Math.min(100,((n-1)/4)*100));
 const rows=PIL.map((name,i)=>{
  const bp=bm&&bm.pillars?bm.pillars.find(x=>x.p===i):null;
  const me=R?(R.pil[i].avgV!=null?R.pil[i].avgV:R.pil[i].avg):(bp?bp.v:null);
  const med=bp&&bp.med!=null?bp.med:null;
  const diff=me!=null&&med!=null?me-med:null;
  const dStr=diff==null?'':`<span class="${diff>=0?'ok':'warn'}" style="margin-left:5px">(${diff>=0?'+':''}${diff.toFixed(1)})</span>`;
  return`<div class="db-row">
   <div><b>${esc(PIL_SHORT[i])}</b></div>
   <div class="db-track">
    <i class="db-axis"></i>
    ${bp&&bp.min!=null&&bp.max!=null?`<i class="db-whisk" style="left:${pct(bp.min)}%;width:${Math.max(pct(bp.max)-pct(bp.min),1)}%" data-tip="${esc(PIL_SHORT[i])} peer range: ${f1(bp.min)}–${f1(bp.max)}"></i>`:''}
    ${bp&&bp.p25!=null&&bp.p75!=null?`<i class="db-iqr" style="left:${pct(bp.p25)}%;width:${Math.max(pct(bp.p75)-pct(bp.p25),2)}%" data-tip="${esc(PIL_SHORT[i])} peer IQR (middle 50%): ${f1(bp.p25)}–${f1(bp.p75)}"></i>`:''}
    ${med!=null?`<i class="db-med" style="left:${pct(med)}%" data-tip="${esc(PIL_SHORT[i])} peer median: ${f1(med)}"></i>`:''}
    ${me!=null?`<i class="db-me" style="left:${pct(me)}%" data-tip="${esc(PIL_SHORT[i])} your avg rung: ${f1(me)}"></i>`:''}
   </div>
   <div class="db-val"><b>${me==null?'n/a':f1(me)}</b>${dStr}</div>
  </div>`;
 }).join('');
 return`<div class="db-wrap"><div class="db-head"><div>Pillar</div><div class="db-ticks"><span>R1</span><span>2</span><span>3</span><span>4</span><span>R5</span></div><div style="text-align:right">You (vs med)</div></div>${rows}<div class="radar-leg"><span><i style="background:#D35400;border-radius:50%"></i>Your cohort</span><span><i style="background:#1A1A24;width:3px"></i>Peer median</span><span><i style="background:var(--r2)"></i>Peer middle 50% (IQR)</span></div></div>`;
}

function slopegraphHtml(sa,sb,ra,rb,lblA,lblB){

 }).filter(Boolean);

 }).join('');
 const upList=pairs.filter(x=>x.q>x.p),dnList=pairs.filter(x=>x.q<x.p);
 const dIdx=ra.idx!=null&&rb.idx!=null?rb.idx-ra.idx:null;
 return`<div class="viz-box"><div class="viz-head"><div><h3>Cycle-over-cycle rung slopegraph</h3><small>${esc(lblA)} vs. ${esc(lblB)}</small></div><div class="viz-acts">${fsBtn('Cycle-over-cycle rung slopegraph')}</div></div><div class="slope-grid">

   <text x="${x2}" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A1A24">${esc(lblB)} (${rb.idx==null?'n/a':rb.idx})</text>
   <line x1="${x1}" y1="${pT}" x2="${x1}" y2="${H-pB}" stroke="#E2E2E8" stroke-width="1.5"/>
   <line x1="${x2}" y1="${pT}" x2="${x2}" y2="${H-pB}" stroke="#E2E2E8" stroke-width="1.5"/>
   ${[1,2,3,4,5].map(r=>`<text x="${x1-12}" y="${(yR(r)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#525263">R${r} ${RUNG[r]}</text><text x="${x2+12}" y="${(yR(r)+3.5).toFixed(1)}" text-anchor="start" font-size="10.5" fill="#525263">R${r} ${RUNG[r]}</text>`).join('')}
   ${lines}
  </svg>
  <div>
   <h3 style="font-size:16px">${upList.length} of ${pairs.length} sub-outcomes climbed</h3>
   <p class="mute" style="margin:6px 0 10px">${dIdx!=null?`Overall index moved <strong style="color:${dIdx>=0?'var(--ok)':'var(--gap)'}">${dIdx>0?'+':''}${dIdx} pts</strong> (${ra.idx} → ${rb.idx}). `:''}Green lines show rung gains; grey lines stayed flat${dnList.length?'; red lines declined.':'.'}</p>
   <div style="display:flex;flex-wrap:wrap;gap:6px">${upList.map(x=>`<span class="chip ok">${esc(x.s.name)} ${x.p}→${x.q}</span>`).join('')}${dnList.map(x=>`<span class="chip hot">${esc(x.s.name)} ${x.p}→${x.q}</span>`).join('')}</div>
  </div>
 </div></div>`;
}

function trendSvg(hist){

 const line=(key,color,dash,lbl)=>{

 };

 return`<div class="trend-wrap"><div class="viz-head" style="margin-bottom:8px"><div><div class="lab" style="margin:0">Index trajectory across saved snapshots</div></div><div class="viz-acts">${fsBtn('Index trajectory across saved snapshots')}</div></div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:640px;display:block" role="img" aria-label="Maturity index trend across snapshots">${grid}${line('idx','#E99A10',true,'Provisional index')}${line('idxv','#D35400',false,'Evidenced index')}${xlabels}</svg><div class="radar-leg"><span><i style="background:#D35400"></i>Evidenced index</span><span><i style="background:#E99A10"></i>Provisional index</span></div></div>`;
}

mits. The wave expectations are advisory reasoning from Zinnov's wave definitions, and sub-outcomes can influence one another, so read peer benchmarks at the pillar and sub-outcome level as like-for-like.</li></ul></section>`;

function waveImpact(c,to){
 const from=c.wave,r={added:0,scored:0,judged:0,newHide:[],newShow:[],keptOdd:0,snaps:0};
 c.cohorts.forEach(h=>{r.snaps+=h.hist.length;Object.values(h.a||{}).forEach(a=>{if(a&&a.in){r.added++;if(a.sc)r.scored++;if(a.vd)r.judged++}})});
 const inAny=id=>c.cohorts.some(h=>h.a&&h.a[id]&&h.a[id].in);
 SUBS.forEach(x=>{
  const was=x.rel[from-1],now=x.rel[to-1];
  if(was&&!now){if(inAny(x.id))r.keptOdd++;else r.newHide.push(x)}
  else if(!was&&now&&!inAny(x.id))r.newShow.push(x);
 });
 return r;
}

 }else tbl='<p class="mute">Loading snapshot comparison...</p>';
 return`<section class="noprint"><h2>Compare over time</h2><p class="lede">Compare any earlier snapshot against a later snapshot or your live unsaved scores, including measured indicator values.</p>
 <div class="ctx"><div class="f"><label for="cmpa">Earlier</label><select id="cmpa" data-c="cmpa"><option value="">Choose a snapshot</option>${opts(cs.a)}</select></div><div class="f"><label for="cmpb">Later</label><select id="cmpb" data-c="cmpb"><option value="cur" ${cs.b==='cur'?'selected':''}>Current scores, not yet saved as a snapshot</option>${opts(cs.b)}</select></div></div>${tbl}</section>`;
}
/* ---------- events ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='apf')return;e.preventDefault();
 const c=$('#apc').value,n=$('#apn').value,r=$('#apr').value,btn=e.target.querySelector('button');
 if(!c||!n)return toast('Please fill in all three password boxes.');
 if(n!==r)return toast('The two new passwords do not match. Please type them again.');
 btn.disabled=true;
 try{await api('POST','/admin/password',{current:c,next:n});e.target.reset();toast('Your admin password has been changed.')}
 catch(err){toast(err.message||'We could not change the password. Please try again.')}
 btn.disabled=false;
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  const box=document.getElementById('fsmodal');
  if(box&&box.innerHTML){closeFs();return}
  if(PRES){PRES=false;render(true);return}
  if(AFOCUS){AFOCUS=false;render(true);return}
 }
 if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.matches('[role="button"][data-a]')){
  e.preventDefault();e.target.click();
 }
});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,id=t.dataset.id,v=t.dataset.v,c=cl(),h=ch();
 if(a==='fs'){openFs(t);return}
 if(a==='fsclose'){closeFs();return}
 if(a==='fsback'){if(e.target===t)closeFs();return}
 if(a==='hmtile'){openTileModal(id);return}
 if(a==='pres'){PRES=!PRES;render(true);return}
 if(a==='afocus'){AFOCUS=!AFOCUS;render(true);return}
 if(a==='jumptocard'){
  closeFs();S.tab='audit';S.pil=0;AVIEW='guided';ASTEP=id;render(false);
  return;
 }
 const wasArm=ARM;ARM='';let keep=true;
 try{
  if(a==='tab'){S.tab=v;keep=false;if(v==='bench')loadBench();else if(v==='report')loadBench(true);else if(v==='clients')loadAcc()}
  else if(a==='pil'){S.pil=+v}
  else if(a==='aview'){AVIEW=v}
  else if(a==='astep'){if(id){ASTEP=id;keep=false}}
  else if(a==='openstep'){AVIEW='guided';ASTEP=id;S.pil=0;keep=false}
  else if(a==='bsubpil'){BSUBPIL=+v}
  else if(a==='pview'){PVIEW=v}
  else if(a==='cview'){CVIEW=v}
  else if(a==='afil'){AF.f=v}
  else if(a==='coll'){COLL[id]=!COLL[id]}
  else if(a==='collall'){SUBS.forEach(s=>{if(A(s.id).in)COLL[s.id]=true})}
  else if(a==='expall'){COLL={}}
  else if(a==='nextgap'){
   const R=compute(c,h),tgt=R.unscored[0]||R.missing[0];
   if(tgt){
    S.pil=0;AVIEW='guided';ASTEP=tgt.s.id;render(false);
    return;
   }
  }
  else if(a==='wq'){const qi=+id,wv=+v;WQ[qi]=WQ[qi]===wv?0:wv}
  else if(a==='clearwq'){WQ=[0,0,0,0,0]}
  else if(a==='applywq'){WCH={client:c.id,to:+v};S.tab='audit';keep=false}
  else if(a==='fexpand'){SUBS.forEach(s=>OPEN[s.id]=true)}
  else if(a==='fcollapse'){SUBS.forEach(s=>delete OPEN[s.id])}
  else if(a==='demorole'){DEMO_DB.role=v;S.role=v;if(v==='client'&&S.tab==='clients')S.tab='report';if(S.tab==='bench')loadBench();else if(S.tab==='clients')loadAcc()}
  else if(a==='demoreset'){startDemo(S.tab);toast('Moonshot Inc. demo workspace reset.');return}
  else if(a==='seedmoonshot'){await seedMoonshotLive();return}
  else if(a==='seedpeers'){await seedPeersLive();return}
  else if(a==='open'){OPEN[id]=!OPEN[id]}
  else if(a==='showrel'){SHOWREL=!SHOWREL}
  else if(a==='scope'){const x=A(id);x.in=!x.in;if(x.in){x.na=false;ASTEP=id}dirty(h)}
  else if(a==='nabychoice'){const x=A(id);x.na=!x.na;if(x.na)x.in=false;dirty(h)}
  else if(a==='pick'){const x=A(id);x.sc=x.sc===+v?0:+v;x.vd=defaultVd(x.sc,c.wave);dirty(h)}
  else if(a==='vd'){const x=A(id);x.vd=x.vd===v?'':v;dirty(h)}
  else if(a==='vdcycle'){const x=A(id);const cur=effVd(x,c.wave);const seq=c.wave===4?['b','m']:['b','m','a'];x.vd=seq[(seq.indexOf(cur)+1)%seq.length];dirty(h)}
  else if(a==='prio'){A(id).pr=v;dirty(h)}
  else if(a==='coh'){S.h=id;ASTEP='';BM={};if(S.tab==='bench')loadBench();else if(S.tab==='report')loadBench(true)}
  else if(a==='newcohort'){const n=await api('POST','/cohort',{client_id:c.id,name:'Cohort '+(c.cohorts.length+1)});c.cohorts.push(n);S.h=n.id;ASTEP='';BM={}}
  else if(a==='delcohort'){
   if(wasArm==='h'+h.id){await api('DELETE','/cohort?id='+h.id);c.cohorts=c.cohorts.filter(x=>x.id!==h.id);S.h=c.cohorts[0].id;ASTEP='';BM={}}
   else ARM='h'+h.id;
  }
  else if(a==='snap'){await flush(h);const r=await api('POST','/snapshot',{cohort_id:h.id});h.hist.push(r);BM={};delete CMP[h.id];toast('Snapshot saved. You can now see it under History.');if(S.tab==='bench')loadBench();else loadBench(true)}
  else if(a==='delsnap'){
   if(wasArm==='s'+id){await api('DELETE','/snapshot?id='+encodeURIComponent(id));h.hist=h.hist.filter(x=>x.id!==id);delete SNAPC[id];delete CMP[h.id];BM={};LG=null;toast('Snapshot deleted.');if(S.tab==='report')loadBench(true)}
   else ARM='s'+id;
  }
  else if(a==='reloadstate'){await reloadState();toast('The latest version has been loaded.')}
  else if(a==='overwrite'){await flush(h,true);toast('Your version has been saved over the newer one.')}
  else if(a==='archclient'){await api('PATCH','/client',{id,archived:true});await reloadState();toast('The client has been archived.')}
  else if(a==='restoreclient'){await api('PATCH','/client',{id,archived:false});await reloadState();toast('The client has been restored.')}
  else if(a==='purgeclient'){
   if(wasArm==='x'+id){await api('DELETE','/client?id='+id);S.archived=S.archived.filter(x=>x.id!==id);toast('The client and all of its data have been permanently deleted.')}
   else ARM='x'+id;
  }
  else if(a==='export'){const r=await api('GET','/export?client='+encodeURIComponent(id));dl(((r.client&&r.client.name)||'client').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()+'-all-data-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(r,null,2));return}
  else if(a==='addlink'){const x=A(id);x.lk=x.lk||[];if(x.lk.length<5)x.lk.push({t:'',u:'',d:''});dirty(h)}
  else if(a==='dellink'){const x=A(id);(x.lk||[]).splice(+v,1);dirty(h)}
  else if(a==='print'){window.print();return}
  else if(a==='dlmd'){const R=compute(c,h);dl(fname(c,h,'md'),'text/markdown',reportText(c,h,R).replace(/^EMPLOYER BRAND MATURITY AUDIT/,'# Employer Brand Maturity Audit'));return}
  else if(a==='dlcsv'){const R=compute(c,h);dl(fname(c,h,'csv'),'text/csv',reportCsv(c,h,R));return}
  else if(a==='dlraw'){dl(fname(c,h,'raw-inputs.md'),'text/markdown',rawMd(c,h));return}
  else if(a==='dlrawjson'){dl(fname(c,h,'raw-inputs.json'),'application/json',rawJson(c,h));return}
  else if(a==='copy'){const tx=$('#rtxt');tx.select();try{const p=navigator.clipboard&&navigator.clipboard.writeText(tx.value);if(p&&p.catch)p.catch(()=>{})}catch(err){}toast('Report copied to clipboard.');return}
  else if(a==='mkclient'){
   const name=($('#ncn').value||'').trim()||'New client',wave=+$('#ncw').value;
   const n=await api('POST','/client',{name,wave});S.clients.push(n);S.c=n.id;S.h=n.cohorts[0].id;ASTEP='';toast('Client added. Choose it in the table to create a password.');
  }
  else if(a==='wavego'){const to=WCH.to;WCH=null;await api('PATCH','/client',{id:c.id,wave:to});c.wave=to;BM={};LG=null;toast('The wave has been changed. Your scores and evidence are all still here.')}
  else if(a==='wavecancel'){WCH=null}
  else if(a==='addcoh'){
   const name=($('#nch').value||'').trim()||'Cohort '+(c.cohorts.length+1);
   const n=await api('POST','/cohort',{client_id:c.id,name});c.cohorts.push(n);BM={};toast('Cohort added. Open the Audit tab to start scoring.');
  }
  else if(a==='delcoh'){
   if(wasArm==='k'+id){await api('DELETE','/cohort?id='+id);c.cohorts=c.cohorts.filter(x=>x.id!==id);if(!c.cohorts.find(x=>x.id===S.h))S.h=c.cohorts[0].id;BM={};LG=null;toast('The cohort has been deleted.')}
   else ARM='k'+id;
  }
  else if(a==='selclient'){WCH=null;S.c=id;S.h=cl().cohorts[0].id;ASTEP='';BM={};NEWPW=null}
  else if(a==='delclient'){
   if(wasArm==='c'+id){await api('DELETE','/client?id='+id);S.clients=S.clients.filter(x=>x.id!==id);pickDefaults();ASTEP='';BM={};LG=null;toast('The client has been deleted.')}
   else ARM='c'+id;
  }
  else if(a==='mkaccess'){
   const label=($('#nal').value||'').trim()||'Client access';
   const r=await api('POST','/access',{client_id:id,label});NEWPW={client:id,pw:r.password};ACC=(await api('GET','/access')).access;
  }
  else if(a==='revoke'){await api('POST','/access/revoke',{id,revoked:v==='1'});ACC=(await api('GET','/access')).access}
  else if(a==='pwcopy'){try{const p=navigator.clipboard&&navigator.clipboard.writeText(NEWPW.pw);if(p&&p.catch)p.catch(()=>{})}catch(err){}toast('Password copied.');return}
  else if(a==='pwdone'){NEWPW=null}
  else if(a==='signout'){await flushAll();try{await fetch('/api/logout',{method:'POST'})}catch(err){}location.href='/login.html';return}
 }catch(err){toast(err.message||'Something went wrong. Please try again.')}
 render(keep);
});
// Instant floating tooltip (#ctip) for charts & live inline rung strip preview
function posTip(el,x,y){
 el.style.left=Math.min(x+14,Math.max(8,window.innerWidth-el.offsetWidth-12))+'px';
 el.style.top=Math.max(8,(y-el.offsetHeight-12<8?y+16:y-el.offsetHeight-12))+'px';
}
document.addEventListener('mouseover',e=>{
 const rg=e.target.closest&&e.target.closest('.rg[data-rid]');
 if(rg){const s=SUBS.find(x=>x.id===rg.dataset.rid),el=document.getElementById('rs-'+rg.dataset.rid);if(s&&el)el.innerHTML=rungStripHtml(s,+rg.dataset.rn)}
 const tipEl=e.target.closest&&e.target.closest('[data-tip]');
 const ct=document.getElementById('ctip');
 if(tipEl&&ct){ct.textContent=tipEl.dataset.tip;ct.style.display='block';posTip(ct,e.clientX,e.clientY)}
});
document.addEventListener('mousemove',e=>{
 const ct=document.getElementById('ctip');
 if(ct&&ct.style.display==='block')posTip(ct,e.clientX,e.clientY);
});
document.addEventListener('mouseout',e=>{
 const rg=e.target.closest&&e.target.closest('.rg[data-rid]');
 if(rg){const s=SUBS.find(x=>x.id===rg.dataset.rid),el=document.getElementById('rs-'+rg.dataset.rid);if(s&&el)el.innerHTML=rungStripHtml(s,A(s.id).sc)}
 const tipEl=e.target.closest&&e.target.closest('[data-tip]');
 if(tipEl&&(!e.relatedTarget||!tipEl.contains(e.relatedTarget))){const ct=document.getElementById('ctip');if(ct)ct.style.display='none'}
});
document.addEventListener('focusin',e=>{
 const rg=e.target.closest&&e.target.closest('.rg[data-rid]');
 if(rg){const s=SUBS.find(x=>x.id===rg.dataset.rid),el=document.getElementById('rs-'+rg.dataset.rid);if(s&&el)el.innerHTML=rungStripHtml(s,+rg.dataset.rn)}
});
document.addEventListener('focusout',e=>{
 const rg=e.target.closest&&e.target.closest('.rg[data-rid]');
 if(rg){const s=SUBS.find(x=>x.id===rg.dataset.rid),el=document.getElementById('rs-'+rg.dataset.rid);if(s&&el)el.innerHTML=rungStripHtml(s,A(s.id).sc)}
});
document.addEventListener('input',e=>{
 const t=e.target,i=t.dataset.i;if(!i)return;
 if(i==='aq'){AF.q=t.value;const pos=t.selectionStart;render(true);const el=document.getElementById('aq');if(el){el.focus();el.setSelectionRange(pos,pos)}return}
 if(i==='fq'){FQ=t.value;const pos=t.selectionStart;render(true);const el=document.getElementById('fq');if(el){el.focus();el.setSelectionRange(pos,pos)}return}
 if(i==='hname'){const h=ch();if(h)h.name=t.value}
 else if(i==='nar'){A(t.dataset.id).nar=t.value;dirty(ch())}
 else if(i==='iv'){A(t.dataset.id).iv=t.value;dirty(ch())}
 else if(i==='ivd'){A(t.dataset.id).ivd=t.value;dirty(ch())}
 else if(i==='xau'||i==='xad'||i==='xiw'){const h=ch();h.a._x=h.a._x||{};h.a._x[{xau:'au',xad:'ad',xiw:'iw'}[i]]=t.value;dirty(h)}
 else if(i==='nt'){A(t.dataset.id).nt=t.value;dirty(ch())}
 else if(i==='xsum'){const h=ch();h.a._x=h.a._x||{};h.a._x.sum=t.value;dirty(h);const pp=document.getElementById('xsum-p');if(pp)pp.textContent=t.value}
 else if(i==='lkt'||i==='lku'||i==='lkd'){const x=A(t.dataset.id),l=(x.lk||[])[+t.dataset.k];if(l){l[{lkt:'t',lku:'u',lkd:'d'}[i]]=t.value;dirty(ch())}}
 else if(i==='ev'){
  const h=ch();A(t.dataset.id).ev=t.value;dirty(h);
  const b=document.getElementById('bd-'+t.dataset.id);if(b)b.innerHTML=badge(A(t.dataset.id));
  const R=compute(cl(),ch()),evPct=R.n?Math.round((R.valid.length/R.n)*100):0,scPct=R.n?Math.round((R.scored.length/R.n)*100):0;
  const gp=document.getElementById('gpct'),ge=document.getElementById('gp-ev'),gs=document.getElementById('gp-sc'),gl=document.getElementById('gstat-l');
  if(gp)gp.textContent=evPct+'%';if(ge)ge.style.width=evPct+'%';if(gs)gs.style.width=scPct+'%';
  if(gl)gl.innerHTML=`${R.valid.length}/${R.n} · Idx <strong style="color:var(--ink)" id="gidx">${R.idx==null?'n/a':R.idx}</strong>`;
 }
});
document.addEventListener('change',async e=>{
 const t=e.target,k=t.dataset.c,i=t.dataset.i;
 try{
  if(i==='lku'){const x=A(t.dataset.id),l=(x.lk||[])[+t.dataset.k];if(l&&l.u&&!/^https?:\/\//i.test(l.u)&&/^[a-z0-9.-]+\.[a-z]{2,}/i.test(l.u.trim())){l.u='https://'+l.u.trim();t.value=l.u;dirty(ch())}return}
  if(i==='hname'){const h=ch();h.name=t.value;await api('PATCH','/cohort',{id:h.id,name:t.value});nav();return}
  if(i==='cname'){const x=cl().cohorts.find(y=>y.id===t.dataset.id);x.name=t.value;await api('PATCH','/cohort',{id:x.id,name:t.value});BM={};setStat('Saved');return}
  if(i==='rename'){const c=cl();c.name=t.value;await api('PATCH','/client',{id:c.id,name:t.value});setStat('Saved');nav();return}
  if(!k)return;
  if(k==='apil'){S.pil=+t.value}
  else if(k==='client'){WCH=null;S.c=t.value;S.h=cl().cohorts[0].id;ASTEP='';BM={};if(S.tab==='bench')loadBench();else if(S.tab==='report')loadBench(true)}
  else if(k==='wavepick'){const c=cl();WCH=+t.value===c.wave?null:{client:c.id,to:+t.value}}
  else if(k==='cmpa'||k==='cmpb'){const h=ch(),cs=CMP[h.id]||(CMP[h.id]={a:'',b:'cur'});cs[k==='cmpa'?'a':'b']=t.value;await getSnap(cs.a);await getSnap(cs.b)}
  else if(k==='bpool'){BO.pool=t.value;loadBench()}
  else if(k==='bbasis'){BO.basis=t.value;loadBench()}
  else if(k==='bmin'){BO.min=+t.value;loadBench()}
 }catch(err){toast(err.message||'Something went wrong. Please try again.')}
 render(true);
});
boot();
</script>
