<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employer Brand Maturity Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A24;--mut:#4D4D5C;--line:#DCDCE2;--paper:#F5F5F7;--acc:#D35400;--acch:#B94700;--gold:#E99A10;
--r1:#D6D6DD;--r2:#F3CF8F;--r3:#E99A10;--r4:#E0770C;--r5:#D35400;--tint:#FBEEE4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 14px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:#fff;display:grid;grid-template-columns:232px 1fr;min-height:100vh}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:700;margin:0;line-height:1.15}
h1{font-size:36px}h2{font-size:21px}h3{font-size:18px}h4{font-size:15px}
p{margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
aside{background:var(--paper);padding:28px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:0 24px 28px;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:17px;line-height:1.2}
.logo small{display:block;font:500 10.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:6px}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:2px solid transparent;padding:12px 24px;text-align:left;color:var(--mut);font-weight:500}
.nav button.on{border-left-color:var(--acc);color:var(--ink);background:#fff}
.nav button:hover{color:var(--acc)}
.side-foot{margin-top:auto;padding:0 24px;font-size:11.5px;color:var(--mut)}
main{padding:56px 64px 120px;max-width:1280px;width:100%}
.ic{flex:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.lede{max-width:70ch;color:var(--mut);font-size:15px;margin-top:12px}
section{margin-top:56px}
section>h2{margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:0}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--paper);color:var(--acc)}
.ib.arm{background:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:8px 16px;font-weight:500}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acch);color:#fff}
.chip{display:inline-block;border-radius:99px;background:var(--paper);padding:2px 10px;font-size:11.5px;color:var(--mut);font-weight:500}
.chip.hot{background:var(--tint);color:var(--acch)}
label,.lab{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:18px 0 6px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
textarea{width:100%;min-height:64px;resize:vertical}
/* framework */
.axes{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:32px}
.axes h3{margin-bottom:8px}
.waves{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:24px;border-top:1px solid var(--line)}
.wave{padding:24px 24px 24px 0;border-right:1px solid var(--line);margin-right:24px}
.wave:last-child{border-right:0;margin-right:0}
.wave .n{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1;color:var(--acc)}
.wave .pc{font-size:12px;color:var(--mut);margin:6px 0 12px}
.wave h3{margin-bottom:10px}
.wave details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.wave summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--acch)}
.fn{font-size:12.5px;margin-top:8px}.fn div{padding:6px 0;border-bottom:1px solid var(--line)}.fn b{display:block}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rungh{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:20px}
.rungh div{padding:12px;font-size:12.5px;border-radius:10px}
.rungh b{display:block;font-family:'Playfair Display',serif;font-size:16px;margin-bottom:4px}
.r1{background:var(--r1)}.r2{background:var(--r2)}.r3{background:var(--r3)}.r4{background:var(--r4);color:#fff}.r5{background:var(--r5);color:#fff}
.pillar{margin-top:40px}
.pillar>h3{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.pillar>h3 span{font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.grid{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:0 12px;min-width:960px}
.hdr{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
.hdr.cur{color:var(--acc)}
.xr{display:contents}
.xr>*{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.xr .nm b{display:block}
.xr .nm small{color:var(--mut)}
.xr .cell{font-size:12.5px;color:var(--ink);padding-right:8px}
.xr .cell.low{color:#8a8a98;background:repeating-linear-gradient(135deg,transparent 0 6px,#f1f1f4 6px 7px)}
.xr:hover>*{background-color:var(--paper)}
.det{grid-column:1/-1;padding:18px 0 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:40px;background:var(--paper);padding-left:20px;padding-right:20px;margin:0 -20px}
.det p{margin:0 0 4px}
.scroll{overflow-x:auto}
.notes{columns:2;column-gap:64px;margin-top:16px}
.notes li{break-inside:avoid;margin-bottom:8px}
/* ctx bar */
.ctx{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;margin-top:28px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.ctx .f{display:flex;flex-direction:column}
.ctx .f label{margin:0 0 4px}
.cohorts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.cohorts .pill{border-radius:99px;border:1px solid var(--line);background:#fff;padding:6px 14px;font-weight:500}
.cohorts .pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:28px}
.how div{border-top:2px solid var(--acc);padding-top:10px;font-size:13px;color:var(--mut)}
.how b{display:block;color:var(--ink);font-family:'Playfair Display',serif;font-size:15px}
.sum{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);display:flex;align-items:center;gap:28px;padding:12px 0;border-bottom:1px solid var(--line);margin-top:24px;flex-wrap:wrap}
.sum b{font-family:'Playfair Display',serif;font-size:22px}
.sum span{color:var(--mut);font-size:12px}
.sum .sp{margin-left:auto}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
.ptabs button{border-radius:99px;border:1px solid var(--line);background:#fff;padding:6px 14px;font-weight:500;font-size:13px}
.ptabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mini{display:grid;grid-template-columns:2fr 1.4fr 40px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mini small{display:block;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin:16px 0}
.card header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card header .id{font:600 11px Inter;letter-spacing:.12em;color:var(--acc)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.means{color:var(--mut);margin:6px 0 14px}
.wv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wv div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.wv b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.wv .cur{border-color:var(--acc);background:var(--tint)}
.wv .low{color:#8a8a98}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.two p{margin:0}
small{font-size:12px;color:var(--mut)}
.rungs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rg{border:2px solid transparent;border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;font-weight:500;opacity:.55}
.rg b{display:block;font-family:'Playfair Display',serif;font-size:20px}
.rg:hover{opacity:.9}
.rungs{position:relative}
.rgw{display:block}
.rgw .rg{width:100%}
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:0;width:min(100%,420px);z-index:20;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;font-weight:400;text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none}
.tip b{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;opacity:.8}
.tip i{display:block;font-style:normal;margin-top:6px;opacity:.7;font-size:11px}
.rgw:hover .tip,.rgw:focus-within .tip{display:block}
.lnk{border:0;background:none;padding:0;margin-top:8px;color:var(--acc);font-weight:500;font-size:12px;text-decoration:underline;cursor:pointer}
.rdef{margin:8px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:12px}
.rdef p{margin:4px 0}
.hid{border:1px dashed var(--line);border-radius:12px;padding:12px 16px;margin:16px 0;background:var(--tint);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hid p{margin:0;flex:1;min-width:240px}
.rnote{font-size:12px;color:var(--mut);margin:0 0 10px}
.rg.on{opacity:1;border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 16px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.foot{display:flex;gap:32px;flex-wrap:wrap;align-items:end}
.ok{color:#1d6b3a;font-size:12px;font-weight:600}.warn{color:var(--acch);font-size:12px;font-weight:600}.mute{color:var(--mut);font-size:12px}
.off{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.off .t{flex:1}.off small{display:block}
/* report */
.big{display:flex;gap:64px;flex-wrap:wrap;margin-top:28px}
.big .m{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1}
.big .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:8px}
.verdict{font-family:'Playfair Display',serif;font-size:24px;line-height:1.3;max-width:34ch;margin-top:28px}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:80px}
.lad{display:flex;gap:3px}
.lad i{flex:1;height:8px;background:var(--line);border-radius:2px}
.lad i.on1{background:var(--r1)}.lad i.on2{background:var(--r2)}.lad i.on3{background:var(--r3)}.lad i.on4{background:var(--r4)}.lad i.on5{background:var(--r5)}
.meter{height:3px;background:var(--line);margin-top:6px}.meter i{display:block;height:3px;background:var(--acc)}
.pb{padding:22px 0;border-bottom:1px solid var(--line)}
.pb h3{display:flex;gap:14px;align-items:baseline}
.pb .no{font-family:'Playfair Display',serif;font-size:32px;color:var(--acc)}
.pb dl{display:grid;grid-template-columns:150px 1fr;gap:6px 20px;margin:12px 0 0}
.pb dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding-top:3px}
.pb dd{margin:0}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:11.5px;font-weight:600}
.tag.b{background:var(--tint);color:var(--acch)}.tag.m{background:var(--paper);color:var(--mut)}.tag.a{background:#E3F2E8;color:#1d6b3a}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:16px}
.plan div{border-top:2px solid var(--acc);padding-top:10px}
.plan b{font-family:'Playfair Display',serif;font-size:16px;display:block;margin-bottom:4px}
ul.pl{margin:8px 0;padding-left:18px}
.empty{padding:48px 0;color:var(--mut)}
.txt{width:100%;min-height:260px;font:12px/1.5 ui-monospace,Menlo,monospace}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:20}

.tbl tr.sel td{background:var(--tint)}
.ctrl{display:flex;gap:24px;flex-wrap:wrap}
.strip{position:relative;height:28px;margin-top:36px}
.strip .axis{position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line)}
.strip .band{position:absolute;top:8px;height:12px;background:var(--r2);border-radius:6px}
.strip .med{position:absolute;top:4px;height:20px;width:2px;background:var(--ink)}
.strip .me{position:absolute;top:0;width:16px;height:28px;margin-left:-8px;border-radius:8px;background:var(--acc)}
.strip-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px}
.pbar{position:relative;height:3px;background:var(--line);margin:10px 0}
.pbar i{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--acc)}
.pwbox{border:1px solid var(--acc);background:var(--tint);border-radius:12px;padding:18px 22px;margin:16px 0}
.pwform{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;margin-top:12px}
.pwform .f{min-width:220px}
.pwbox .pw{font:600 26px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.06em}
@media(max-width:1000px){.waves{grid-template-columns:1fr 1fr}.wave{border-right:0;margin-right:0}.axes,.two-col,.det,.two{grid-template-columns:1fr;gap:24px}.how{grid-template-columns:1fr 1fr}.plan{grid-template-columns:1fr}.notes{columns:1}}
@media(max-width:760px){
body{display:block}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:0;z-index:30;border-top:1px solid var(--line)}
.logo,.side-foot{display:none}
.nav{flex-direction:row;width:100%}.nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:10px 4px;border-left:0;border-top:2px solid transparent;align-items:center}
.nav button.on{border-top-color:var(--acc)}
main{padding:28px 20px 110px}h1{font-size:28px}
.waves,.wv,.rungh{grid-template-columns:1fr 1fr}.rungs{grid-template-columns:repeat(5,1fr)}.rg{font-size:10px}
.how{grid-template-columns:1fr}.big{gap:32px}.pb dl{grid-template-columns:1fr}
}

.printhead,.printonly{display:none}
.lk{display:grid;grid-template-columns:1.2fr 2fr 150px auto;gap:8px;margin:6px 0;align-items:center}
.lk input{width:100%}
.note{white-space:pre-wrap}
.xlist{list-style:none;padding:0;margin:8px 0}.xlist li{border-top:1px solid var(--line);padding:10px 0}
.xrow{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.lk{grid-template-columns:1fr}}
@media print{
@page{margin:16mm 14mm}
body{display:block;font-size:11.5px;color:#000}
aside,.noprint,.toast,button,.ib{display:none!important}
main{padding:0;max-width:none}
.printhead{display:block;border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:18px}
.printhead b{font-family:'Playfair Display',Georgia,serif;font-size:20px}
.printonly{display:block}
section,.pb,.mini,.verdict{break-inside:avoid}
h2,h3{break-after:avoid}
a{color:inherit;text-decoration:none}
.scroll{overflow:visible}
}
</style>
</head>
<body>
<aside>
  <div class="logo">Employer Brand<br>Maturity Index<small>Zinnov EB practice</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="sidefoot"></div>
</aside>
<main id="app"></main>
<script>
/* ---------- icons (Lucide style, inline) ---------- */
const ICON={
frame:'<path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
audit:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
report:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
snap:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
bench:'<path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/>',
clients:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>'
};
const ic=(n,sz=18)=>`<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- framework data (Zinnov EB framework v1.0 + instrument v1.0) ---------- */
const WAVES=[
{name:'Outpost',pc:13,mandate:'A small team delivering a defined function for the parent, often under a service brand or a shared services name. Hiring is the whole job, and the brand question has not been asked yet.',must:'Make a centre with no name of its own credible enough that good people join first. The parent\'s reputation, the leader\'s reputation and the role\'s specificity are the only assets. The first twenty hires are the brand.',fail:'Selling the parent\'s global purpose while being unable to describe the day job. Candidates are lost after offer, because the distance between the job described and the job done drives first-year exits.',
 fn:[['Communications','A clear answer to "what is this place, who runs it, what will I do"','One page a candidate can read in two minutes'],['Marketing','Job ads that name the work, the team and the working pattern','Ads consistent with the actual role'],['Talent acquisition','Speed and honesty, no promises the centre cannot keep','Offer acceptance and 90-day retention'],['Engagement and HR','Onboarding that makes the parent\'s name mean something locally','New-joiner feedback with action taken'],['Leadership','Local leader visible and available','Leader present in the hiring process and in onboarding']]},
{name:'Satellite',pc:43,mandate:'A stable delivery centre, several functions, growing headcount, still mostly execution. This is where employer brand is usually still unowned.',must:'Replace improvisation with consistency. One value proposition, one set of facts, used everywhere, plus the first honest measurement of whether it works.',fail:'Paying for volume. Application start rate benchmarks at 66 per cent on LinkedIn against 14 per cent on Meta (Wiser), and conversion after the click explains about 70 per cent of cost per applicant (Boostpoint). Volume without conversion is the most common satellite mistake.',

{name:'Portfolio Hub',pc:39,mandate:'Multiple practices, real ownership of work, global stakeholders, decisions made in India. The centre now has something of its own to sell.',must:'Move from delivery language to ownership language, and prove it with numbers. This is the first wave where the brand can lead demand rather than describe it.',fail:'Talking ownership while running satellite rituals. Candidates read the assessment process, the rejection letter and the first ninety days as the proof, and those are the touchpoints where the claim is tested.',

function compute(client,cohort){
 const wave=client.wave,rows=[];
 SUBS.forEach(s=>{const a=cohort.a[s.id];if(a&&a.in)rows.push({s,a,w:1,sc:a.sc||0,ok:!!(a.sc&&(a.ev||'').trim())})});
 const scored=rows.filter(r=>r.sc),valid=scored.filter(r=>r.ok);
 const wm=(arr,f)=>{const t=arr.reduce((x,r)=>x+r.w,0);return t?arr.reduce((x,r)=>x+f(r)*r.w,0)/t:null};
 const avg=wm(scored,r=>r.sc),avgV=wm(valid,r=>r.sc);
 const idx=v=>v==null?null:Math.round((v-1)/4*100);
 const pil=PIL.map((n,p)=>{const g=scored.filter(r=>r.s.p===p);return{n,p,cnt:g.length,avg:wm(g,r=>r.sc)}});
 const below=scored.filter(r=>r.a.vd==='b'),above=scored.filter(r=>r.a.vd==='a');
 const cand=scored.filter(r=>r.sc<5&&(r.a.vd!=='a'||r.a.pr==='f')).sort((x,y)=>((y.a.pr==='f')-(x.a.pr==='f'))||((y.a.vd==='b')-(x.a.vd==='b'))||(x.sc-y.sc));
 const top=[],used=new Set();
 cand.forEach(r=>{const o=r.s.owner.split(' with ')[0];if(!used.has(o)&&top.length<3){top.push(r);used.add(o)}});
 cand.forEach(r=>{if(top.length<3&&!top.includes(r))top.push(r)});
 const strengths=scored.filter(r=>r.a.vd==='a'||r.sc>=4).sort((x,y)=>y.sc-x.sc).slice(0,4);
 return{wave,rows,scored,valid,avg,avgV,idx:idx(avg),idxV:idx(avgV),pil,below,above,top,strengths,
  missing:scored.filter(r=>!r.ok),unscored:rows.filter(r=>!r.sc),n:rows.length};
}
function waveLine(client,R){
 const W=WAVES[R.wave-1].name;
 if(!R.scored.length)return'Score a few sub-outcomes on the Audit tab, and this line will tell you how the brand stands against what is expected at this wave.';
 if(R.wave>=3&&R.avg<=2.5)return`The centre\'s mandate has outgrown its employer brand story. A ${W} centre is still being judged on the kind of communication expected of a Satellite, with an average rung of ${R.avg.toFixed(1)} against a wave that asks for ownership language and proof.`;
 if(R.below.length/R.scored.length>=0.5)return`${R.below.length} of ${R.scored.length} scored sub-outcomes sit below what a ${W} centre is expected to show. That gap is the main work for this engagement.`;
 if(R.below.length===0&&R.above.length>0)return`No scored sub-outcome sits below the ${W} expectation, and ${R.above.length} sit above it. Say so plainly to the client, and then choose together where to aim next.`;
 return`${R.below.length} of ${R.scored.length} scored sub-outcomes sit below the ${W} expectation. The profile is uneven, and that unevenness is the most useful thing to show the client.`;
}
function nextMove(r){
 const to=Math.min(r.sc+1,5);
 if(r.sc>=4)return`Hold at ${RUNG[r.sc]} for now. Reaching Category takes years and depends on the city and the practice, so it should not be sold as a goal for this year. The useful work is to protect the evidence the centre already has and keep it fresh.`;
 return`Move from ${RUNG[r.sc]} to ${RUNG[to]}. This is one rung only, which is the most a centre can realistically climb in a year.`;
}

function waveImpact(c,to){
 const from=c.wave,r={added:0,scored:0,judged:0,newHide:[],newShow:[],keptOdd:0,snaps:0};
 c.cohorts.forEach(h=>{r.snaps+=h.hist.length;Object.values(h.a||{}).forEach(a=>{if(a&&a.in){r.added++;if(a.sc)r.scored++;if(a.vd)r.judged++}})});
 const inAny=id=>c.cohorts.some(h=>h.a&&h.a[id]&&h.a[id].in);
 SUBS.forEach(x=>{
  const was=x.rel[from-1],now=x.rel[to-1];
  if(was&&!now){if(inAny(x.id))r.keptOdd++;else r.newHide.push(x)}
  else if(!was&&now&&!inAny(x.id))r.newShow.push(x);
 });
 return r;
}

  <h3 style="margin-top:32px">Passwords</h3><p class="lede" style="margin-top:6px">Each password opens this client\'s workspace and nothing else. Issue a separate password for each person or team, so that you can switch one off later without affecting the others.</p>
  ${NEWPW&&NEWPW.client===sel.id?`<div class="pwbox"><div class="lab" style="margin-top:0">New password. It is shown only this once</div><div class="pw">${esc(NEWPW.pw)}</div><p class="mute" style="margin:6px 0 10px">Send it to the person together with this address: ${esc(location.origin)}. We cannot show it again, so if it is lost you will need to create a new password and revoke this one.</p><button class="btn" data-a="pwcopy">${ic('copy',16)} Copy</button> <button class="btn" data-a="pwdone">Done</button></div>`:''}
  <div class="ctx" style="margin-top:12px;border:0;padding:0"><div class="f"><label for="nal">Label for the new password</label><input id="nal" placeholder="Who is this password for? For example, Priya (CHRO)"></div><button class="btn pri" data-a="mkaccess" data-id="${sel.id}">${ic('key',16)} Create password</button></div>
  <div class="scroll"><table class="tbl"><tr><th>Label</th><th>Created</th><th>Last signed in</th><th>Status</th><th></th></tr>${acc.map(a=>`<tr><td>${esc(a.label)}</td><td>${dshort(a.created_at)}</td><td>${dshort(a.last_login)}</td><td>${a.revoked?'<span class="warn">Revoked</span>':'<span class="ok">Active</span>'}</td><td><button class="ib" data-a="revoke" data-id="${a.id}" data-v="${a.revoked?0:1}" aria-label="${a.revoked?'Restore this password':'Revoke this password'}" title="${a.revoked?'Restore this password so it works again':'Revoke this password so it stops working'}">${ic(a.revoked?'plus':'x')}</button></td></tr>`).join('')||'<tr><td colspan="5" class="mute">No passwords have been created for this client yet.</td></tr>'}</table></div></section>`:'';
 return`<div class="eyebrow">Admin</div><h1 style="margin-top:8px">Clients</h1>
 <p class="lede">Each client has its own workspace, protected by its own password. As the admin, you can open every workspace, while each client can only open its own. Add a client below, then choose it in the table to create passwords for it.</p>
 <div class="ctx"><div class="f"><label for="ncn">Name of the new client</label><input id="ncn" placeholder="For example, Acme India GCC"></div><div class="f"><label for="ncw">GCC wave</label><select id="ncw">${WAVES.map((w,i)=>`<option value="${i+1}" ${i===1?'selected':''}>${i+1} ${w.name}</option>`).join('')}</select></div><button class="btn pri" data-a="mkclient">${ic('plus',16)} Add client</button></div>
 <div class="scroll"><table class="tbl"><tr><th>Client</th><th>Wave</th><th>Cohorts</th><th>Last snapshot saved</th></tr>${rows||'<tr><td colspan="4" class="mute">No clients have been added yet. Use the form above to add the first one.</td></tr>'}</table></div>
 ${panel}
 ${(S.archived||[]).length?`<section><h2>Archived clients</h2><p class="lede" style="margin-top:6px">These clients are hidden everywhere else and are left out of benchmarks. Restore one to bring it back exactly as it was. Deleting permanently removes the client, its cohorts, its snapshots and its passwords, and it cannot be undone.</p><div class="scroll"><table class="tbl"><tr><th>Client</th><th>Wave</th><th></th></tr>${S.archived.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.wave} ${WNAME(x.wave)}</td><td><button class="btn" data-a="restoreclient" data-id="${x.id}">Restore</button> <button class="btn ${ARM==='x'+x.id?'arm':''}" data-a="purgeclient" data-id="${x.id}">${ARM==='x'+x.id?'Click again to delete permanently':'Delete permanently'}</button></td></tr>`).join('')}</table></div></section>`:''}
 <section><h2>Your admin password</h2><p class="lede" style="margin-top:6px">Use this form to change the password you use to sign in as admin. Spaces and capital letters are ignored when the password is checked. Please choose at least 12 characters, and a few unrelated words strung together is an easy way to get there. Your clients\' passwords are not affected.</p>
 <form class="pwform" id="apf" autocomplete="off"><div class="f"><label for="apc">Current password</label><input id="apc" type="password" autocomplete="current-password" spellcheck="false"></div>
 <div class="f"><label for="apn">New password</label><input id="apn" type="password" autocomplete="new-password" spellcheck="false"></div>
 <div class="f"><label for="apr">Repeat new password</label><input id="apr" type="password" autocomplete="new-password" spellcheck="false"></div>
 <button class="btn pri" type="submit">${ic('key',16)} Change password</button></form></section>`;
}

function benchBlock(h){
 const d=BM.for===h.id&&BM.data&&BM.data.eligible?BM.data:null;
 if(!d)return'';
 const i=d.idx;
 return`<section><h2>Where this brand sits among its peers</h2><p class="lede">${ord(i.pct)} percentile, rank ${i.rank} of ${i.of}${d.position?', '+esc(d.position.toLowerCase()):''}, from the latest saved snapshot (${esc(d.taken_on)}). The Benchmark tab has the pillar and sub-outcome positions.</p></section>`;
}
function benchText(h){
 const d=BM.for===h.id&&BM.data&&BM.data.eligible?BM.data:null;
 if(!d)return[];
 return['Peer position',`${ord(d.idx.pct)} percentile, rank ${d.idx.rank} of ${d.idx.of}${d.pool.thin?' (small pool, indicative)':''}, snapshot ${d.taken_on}.`,''];
}

function dl(name,mime,text){const b=new Blob([text],{type:mime+';charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const fname=(c,h,ext)=>((c.name||'client')+'-'+(h.name||'cohort')+'-'+new Date().toISOString().slice(0,10)).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()+'.'+ext;
function csvCell(v){let t=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function reportCsv(c,h,R){
 const rows=[['Client','Cohort','Wave','Sub-outcome id','Sub-outcome','Pillar','Owner','Status','Rung','Rung name','Compared with wave expectation','Evidenced','Priority','Artefact','Measured value','Measured on','Notes','Evidence links']];
 rawModel(c,h).pillars.forEach(g=>g.items.forEach(x=>{const r=rawItem(c,x),a=x.a,sc=a.sc||0;
  rows.push([c.name,h.name,WNAME(c.wave),r.id,r.name,r.pillar,r.owner,r.status,sc||'',sc?RUNG[sc]:'',{b:'Below',m:'Meets',a:'Above'}[a.vd]||'',sc?(r.evidenceRecorded?'Yes':'No'):'',r.priority==='Client focus'?'Focus':'Normal',r.evidence,r.measuredValue.value,r.measuredValue.measuredOn,r.notes,r.evidenceLinks.map(l=>`${l.title} ${l.url}${l.seen?' (seen '+l.seen+')':''}`.trim()).join('; ')])}));
 return '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}

const CMP={},SNAPC={};
async function getSnap(id){if(id&&id!=='cur'&&!SNAPC[id])SNAPC[id]=await api('GET','/snapshot?id='+encodeURIComponent(id))}
function cmpSection(c,h){
 if(!h.hist.length)return'';
 const cs=CMP[h.id]||(CMP[h.id]={a:'',b:'cur'});
 const opts=sel=>h.hist.slice().reverse().map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>Snapshot of ${esc(x.d)} (index ${x.idx==null?'n/a':x.idx})</option>`).join('');
 const sa=cs.a?SNAPC[cs.a]:null,sb=cs.b==='cur'?{answers:h.a}:SNAPC[cs.b];
 let tbl='';
 if(sa&&sb){
  const st=(ans,id)=>{const x=ans[id];return x&&x.in?(x.sc||0):null};
  const show=v=>v==null?'<span class="mute">Not audited</span>':v?`${v} ${RUNG[v]}`:'<span class="mute">Not scored</span>';
  const rows=SUBS.filter(x=>st(sa.answers,x.id)!=null||st(sb.answers,x.id)!=null).map(x=>{
   const p=st(sa.answers,x.id),q=st(sb.answers,x.id);
   const d=p>0&&q>0?(q>p?`<span class="ok">Up ${q-p}</span>`:q<p?`<span class="warn">Down ${p-q}</span>`:'<span class="mute">No change</span>'):(p==null?'<span class="mute">Added</span>':q==null?'<span class="mute">Removed</span>':'');
   const iv=o=>{const y=o[x.id];return y&&(y.iv||'').trim()?esc(y.iv.trim())+(y.ivd?' <small>('+esc(y.ivd)+')</small>':''):'<span class="mute">none</span>'};
   return`<tr><td><b>${esc(x.name)}</b></td><td>${show(p)}</td><td>${show(q)}</td><td>${d}</td><td>${iv(sa.answers)}</td><td>${iv(sb.answers)}</td></tr>`}).join('');
  const ra=compute(c,{a:sa.answers}),rb=compute(c,{a:sb.answers}),f=v=>v==null?'n/a':v;
  tbl=`<p class="lede">Provisional index ${f(ra.idx)} then, ${f(rb.idx)} now. Evidenced index ${f(ra.idxV)} then, ${f(rb.idxV)} now. Rungs compared: ${ra.scored.length} then, ${rb.scored.length} now.</p><div class="scroll"><table class="tbl"><tr><th>Sub-outcome</th><th>Earlier</th><th>Later</th><th>Change</th><th>Measured value, earlier</th><th>Measured value, later</th></tr>${rows||'<tr><td colspan="6" class="mute">Neither version has sub-outcomes being audited.</td></tr>'}</table></div>`;
 }else tbl='<p class="mute">Choose an earlier snapshot to see how each sub-outcome has moved.</p>';
 return`<section class="noprint"><h2>Compare over time</h2><p class="lede">Pick an earlier snapshot and a later one, or compare a snapshot with the scores as they stand now. Each row shows the rung on both dates and whether it moved, along with the measured indicator values you recorded. This is the clearest way to show a client what changed between cycles.</p>
 <div class="ctx"><div class="f"><label for="cmpa">Earlier</label><select id="cmpa" data-c="cmpa"><option value="">Choose a snapshot</option>${opts(cs.a)}</select></div><div class="f"><label for="cmpb">Later</label><select id="cmpb" data-c="cmpb"><option value="cur" ${cs.b==='cur'?'selected':''}>Current scores, not yet saved as a snapshot</option>${opts(cs.b)}</select></div></div>${tbl}</section>`;
}
/* ---------- events ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
document.addEventListener('submit',async e=>{
 if(e.target.id!=='apf')return;e.preventDefault();
 const c=$('#apc').value,n=$('#apn').value,r=$('#apr').value,btn=e.target.querySelector('button');
 if(!c||!n)return toast('Please fill in all three password boxes.');
 if(n!==r)return toast('The two new passwords do not match. Please type them again.');
 btn.disabled=true;
 try{await api('POST','/admin/password',{current:c,next:n});e.target.reset();toast('Your admin password has been changed.')}
 catch(err){toast(err.message||'We could not change the password. Please try again.')}
 btn.disabled=false;
});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,id=t.dataset.id,v=t.dataset.v,c=cl(),h=ch();
 const wasArm=ARM;ARM='';let keep=true;
 try{
  if(a==='tab'){S.tab=v;keep=false;if(v==='bench')loadBench();else if(v==='report')loadBench(true);else if(v==='clients')loadAcc()}
  else if(a==='pil'){S.pil=+v}
  else if(a==='open'){OPEN[id]=!OPEN[id]}
  else if(a==='showrel'){SHOWREL=!SHOWREL}
  else if(a==='scope'){const x=A(id);x.in=!x.in;dirty(h)}
  else if(a==='pick'){const x=A(id);x.sc=x.sc===+v?0:+v;dirty(h)}
  else if(a==='vd'){const x=A(id);x.vd=x.vd===v?'':v;dirty(h)}
  else if(a==='prio'){A(id).pr=v;dirty(h)}
  else if(a==='coh'){S.h=id;BM={};if(S.tab==='bench')loadBench();else if(S.tab==='report')loadBench(true)}
  else if(a==='newcohort'){const n=await api('POST','/cohort',{client_id:c.id,name:'Cohort '+(c.cohorts.length+1)});c.cohorts.push(n);S.h=n.id;BM={}}
  else if(a==='delcohort'){
   if(wasArm==='h'+h.id){await api('DELETE','/cohort?id='+h.id);c.cohorts=c.cohorts.filter(x=>x.id!==h.id);S.h=c.cohorts[0].id;BM={}}
   else ARM='h'+h.id;
  }
  else if(a==='snap'){await flush(h);const r=await api('POST','/snapshot',{cohort_id:h.id});h.hist.push(r);BM={};toast('Snapshot saved. You can now see it under History.');if(S.tab==='bench')loadBench();else loadBench(true)}
  else if(a==='reloadstate'){await reloadState();toast('The latest version has been loaded.')}
  else if(a==='overwrite'){await flush(h,true);toast('Your version has been saved over the newer one.')}
  else if(a==='archclient'){await api('PATCH','/client',{id,archived:true});await reloadState();toast('The client has been archived. It is hidden from the app and from benchmarks, and you can restore it from the Archived clients list on this tab.')}
  else if(a==='restoreclient'){await api('PATCH','/client',{id,archived:false});await reloadState();toast('The client has been restored.')}
  else if(a==='purgeclient'){
   if(wasArm==='x'+id){await api('DELETE','/client?id='+id);S.archived=S.archived.filter(x=>x.id!==id);toast('The client and all of its data have been permanently deleted.')}
   else ARM='x'+id;
  }
  else if(a==='export'){const r=await api('GET','/export?client='+encodeURIComponent(id));dl(((r.client&&r.client.name)||'client').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase()+'-all-data-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(r,null,2));return}
  else if(a==='addlink'){const x=A(id);x.lk=x.lk||[];if(x.lk.length<5)x.lk.push({t:'',u:'',d:''});dirty(h)}
  else if(a==='dellink'){const x=A(id);(x.lk||[]).splice(+v,1);dirty(h)}
  else if(a==='print'){window.print();return}
  else if(a==='dlmd'){const R=compute(c,h);dl(fname(c,h,'md'),'text/markdown',reportText(c,h,R).replace(/^EMPLOYER BRAND MATURITY AUDIT/,'# Employer Brand Maturity Audit'));return}
  else if(a==='dlcsv'){const R=compute(c,h);dl(fname(c,h,'csv'),'text/csv',reportCsv(c,h,R));return}
  else if(a==='dlraw'){dl(fname(c,h,'raw-inputs.md'),'text/markdown',rawMd(c,h));return}
  else if(a==='dlrawjson'){dl(fname(c,h,'raw-inputs.json'),'application/json',rawJson(c,h));return}
  else if(a==='copy'){const tx=$('#rtxt');tx.select();try{const p=navigator.clipboard&&navigator.clipboard.writeText(tx.value);if(p&&p.catch)p.catch(()=>{})}catch(err){}toast('Report copied. If it does not paste, select the text in the box below and copy it yourself.');return}
  else if(a==='mkclient'){
   const name=($('#ncn').value||'').trim()||'New client',wave=+$('#ncw').value;
   const n=await api('POST','/client',{name,wave});S.clients.push(n);S.c=n.id;S.h=n.cohorts[0].id;toast('Client added. Choose it in the table to create a password.');
  }
  else if(a==='wavego'){const to=WCH.to;WCH=null;await api('PATCH','/client',{id:c.id,wave:to});c.wave=to;BM={};LG=null;toast('The wave has been changed. Your scores and evidence are all still here.')}
  else if(a==='wavecancel'){WCH=null}
  else if(a==='addcoh'){
   const name=($('#nch').value||'').trim()||'Cohort '+(c.cohorts.length+1);
   const n=await api('POST','/cohort',{client_id:c.id,name});c.cohorts.push(n);BM={};toast('Cohort added. Open the Audit tab and choose it to start scoring.');
  }
  else if(a==='delcoh'){
   if(wasArm==='k'+id){await api('DELETE','/cohort?id='+id);c.cohorts=c.cohorts.filter(x=>x.id!==id);if(!c.cohorts.find(x=>x.id===S.h))S.h=c.cohorts[0].id;BM={};LG=null;toast('The cohort has been deleted.')}
   else ARM='k'+id;
  }
  else if(a==='selclient'){WCH=null;S.c=id;S.h=cl().cohorts[0].id;BM={};NEWPW=null}
  else if(a==='delclient'){
   if(wasArm==='c'+id){await api('DELETE','/client?id='+id);S.clients=S.clients.filter(x=>x.id!==id);pickDefaults();BM={};LG=null;toast('The client has been deleted.')}
   else ARM='c'+id;
  }
  else if(a==='mkaccess'){
   const label=($('#nal').value||'').trim()||'Client access';
   const r=await api('POST','/access',{client_id:id,label});NEWPW={client:id,pw:r.password};ACC=(await api('GET','/access')).access;
  }
  else if(a==='revoke'){await api('POST','/access/revoke',{id,revoked:v==='1'});ACC=(await api('GET','/access')).access}
  else if(a==='pwcopy'){try{const p=navigator.clipboard&&navigator.clipboard.writeText(NEWPW.pw);if(p&&p.catch)p.catch(()=>{})}catch(err){}toast('Password copied.');return}
  else if(a==='pwdone'){NEWPW=null}
  else if(a==='signout'){await flushAll();try{await fetch('/api/logout',{method:'POST'})}catch(err){}location.href='/login.html';return}
 }catch(err){toast(err.message||'Something went wrong. Please try again.')}
 render(keep);
});
document.addEventListener('input',e=>{
 const t=e.target,i=t.dataset.i;if(!i)return;
 if(i==='hname'){const h=ch();if(h)h.name=t.value}
 else if(i==='iv'){A(t.dataset.id).iv=t.value;dirty(ch())}
 else if(i==='ivd'){A(t.dataset.id).ivd=t.value;dirty(ch())}
 else if(i==='xau'||i==='xad'||i==='xiw'){const h=ch();h.a._x=h.a._x||{};h.a._x[{xau:'au',xad:'ad',xiw:'iw'}[i]]=t.value;dirty(h)}
 else if(i==='nt'){A(t.dataset.id).nt=t.value;dirty(ch())}
 else if(i==='xsum'){const h=ch();h.a._x=h.a._x||{};h.a._x.sum=t.value;dirty(h);const pp=document.getElementById('xsum-p');if(pp)pp.textContent=t.value}
 else if(i==='lkt'||i==='lku'||i==='lkd'){const x=A(t.dataset.id),l=(x.lk||[])[+t.dataset.k];if(l){l[{lkt:'t',lku:'u',lkd:'d'}[i]]=t.value;dirty(ch())}}
 else if(i==='ev'){const h=ch();A(t.dataset.id).ev=t.value;dirty(h);const b=document.getElementById('bd-'+t.dataset.id);if(b)b.innerHTML=badge(A(t.dataset.id));const s=$('#sum');if(s){const R=compute(cl(),ch());s.innerHTML=sumInner(R,'')}}
});
document.addEventListener('change',async e=>{
 const t=e.target,k=t.dataset.c,i=t.dataset.i;
 try{
  if(i==='hname'){const h=ch();h.name=t.value;await api('PATCH','/cohort',{id:h.id,name:t.value});return}
  if(i==='cname'){const x=cl().cohorts.find(y=>y.id===t.dataset.id);x.name=t.value;await api('PATCH','/cohort',{id:x.id,name:t.value});BM={};setStat('Saved');return}
  if(i==='rename'){const c=cl();c.name=t.value;await api('PATCH','/client',{id:c.id,name:t.value});setStat('Saved');return}
  if(!k)return;
  if(k==='client'){WCH=null;S.c=t.value;S.h=cl().cohorts[0].id;BM={};if(S.tab==='bench')loadBench();else if(S.tab==='report')loadBench(true)}
  else if(k==='wavepick'){const c=cl();WCH=+t.value===c.wave?null:{client:c.id,to:+t.value}}
  else if(k==='cmpa'||k==='cmpb'){const h=ch(),cs=CMP[h.id]||(CMP[h.id]={a:'',b:'cur'});cs[k==='cmpa'?'a':'b']=t.value;await getSnap(cs.a);await getSnap(cs.b)}
  else if(k==='bpool'){BO.pool=t.value;loadBench()}
  else if(k==='bbasis'){BO.basis=t.value;loadBench()}
  else if(k==='bmin'){BO.min=+t.value;loadBench()}
 }catch(err){toast(err.message||'Something went wrong. Please try again.')}
 render(true);
});
boot();
</script>
