<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in | Employer Brand Maturity Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1A24;--mut:#4D4D5C;--line:#DCDCE2;--paper:#F5F5F7;--acc:#D35400;--acch:#B94700;--gold:#E99A10}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:400 14px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:#fff;padding:24px}
main{width:100%;max-width:420px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:36px;line-height:1.15;margin:8px 0 12px}
p{color:var(--mut);margin:0 0 28px}
label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:6px}
input{width:100%;font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input:focus{outline:2px solid var(--gold)}
button{margin-top:16px;width:100%;border:0;border-radius:99px;background:var(--acc);color:#fff;font:600 14px Inter;padding:12px 20px;cursor:pointer}
button:hover{background:var(--acch)}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--acch);min-height:22px;margin-top:12px;font-weight:500}
.foot{margin-top:40px;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Zinnov employer brand practice</div>
  <h1>Employer brand maturity index</h1>
  <p>Enter the password you were given to open your workspace.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" autofocus spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
    <button id="go" type="submit">Open workspace</button>
    <div id="err" role="alert"></div>
  </form>
  <div class="foot">Each password opens one client's workspace. If yours does not work, ask the person who sent it.</div>
</main>
<script>
const f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value}),credentials:'same-origin'});
    const j=await r.json().catch(()=>({}));
    if(r.ok){location.href='/';return}
    err.textContent=j.error||'Sign in failed.';
  }catch(x){err.textContent='Could not reach the server. Try again.'}
  go.disabled=false;pw.select();
});
</script>
</body>
</html>
